name: CI Workflow

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Build with Maven / Gradle / Javac
        run: |
          if [ -f pom.xml ]; then mvn test; elif [ -f build.gradle ]; then ./gradlew test; else find . -name "*.java" | xargs javac; fi
